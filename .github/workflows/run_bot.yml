name: 24/7 AI Image Auto-Poster

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  generate_and_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      - name: Run AI Automation Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          MAKE_WEBHOOK_URL: ${{ secrets.MAKE_WEBHOOK_URL }}
        run: python bot.py

      - name: Commit and Push Updates
        run: |
          git config --global user.name "AI-Art-Director"
          git config --global user.email "actions@github.com"
          git add history.txt latest_image.jpg
          git commit -m "Generated new cinematic image and updated memory log" || echo "No changes to commit"
          git push
